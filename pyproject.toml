[project]
name = "courtyard"
version = "0.1.4"
description = "Agent Courtyard - a local communication hub for your team of AI agents"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # the menu bar app (courtyard-tray). A normal dependency, not an extra, on purpose:
    # the tray LaunchAgent execs .venv/bin/courtyard-tray, and a plain `uv sync` (the
    # documented dev step) removes anything an extra brought in, which left the tray
    # crash-looping under KeepAlive. macOS only, like the app itself.
    "rumps>=0.4; sys_platform == 'darwin'",
]

[project.urls]
Repository = "https://github.com/vkuusk/cbx-agent-courtyard"

[project.scripts]
courtyard-hub = "courtyard.hub.main:cli"
courtyard-dummy = "courtyard.dummy.main:cli"
courtyard-claude-mcp = "courtyard.adapters.claude_code.mcp_server:cli"
courtyard-invite = "courtyard.adapters.claude_code.invite:cli"
courtyard-tray = "courtyard.tray:main"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/courtyard"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # CPython 3.14's own asyncio.to_thread calls the function it deprecated; not ours to fix
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    # TestTtyProbe forks a pty from the (multi-threaded) test process; the child execs at once
    "ignore:This process .* is multi-threaded, use of forkpty:DeprecationWarning",
]
