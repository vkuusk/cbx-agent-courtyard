[project]
name = "courtyard"
version = "0.1.0"
description = "Agent Courtyard - a local communication hub for your team of AI agents"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/vkuusk/cbx-agent-courtyard"

[project.scripts]
courtyard-hub = "courtyard.hub.main:cli"
courtyard-dummy = "courtyard.dummy.main:cli"
courtyard-claude-mcp = "courtyard.adapters.claude_code.mcp_server:cli"
courtyard-invite = "courtyard.adapters.claude_code.invite:cli"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/courtyard"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
