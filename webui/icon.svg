<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Agent Courtyard icon: top-down plan of a walled courtyard.
       Walls dark neutral; gate opening bottom-center with the operator (green);
       agents (blue) inside connected to the hub (yellow) in the center. -->

  <!-- courtyard wall: square ring with rounded outer corners, gate gap at bottom -->
  <path fill="#3b4252" fill-rule="evenodd" d="
    M 60 16
    H 196
    A 44 44 0 0 1 240 60
    V 196
    A 44 44 0 0 1 196 240
    H 158 V 212 H 196
    A 16 16 0 0 0 212 196
    V 60
    A 16 16 0 0 0 196 44
    H 60
    A 16 16 0 0 0 44 60
    V 196
    A 16 16 0 0 0 60 212
    H 98 V 240 H 60
    A 44 44 0 0 1 16 196
    V 60
    A 44 44 0 0 1 60 16
    Z"/>

  <!-- lines from agents to the hub -->
  <g stroke="#3b4252" stroke-width="7" opacity="0.55">
    <line x1="128" y1="128" x2="83"  y2="83"/>
    <line x1="128" y1="128" x2="173" y2="83"/>
    <line x1="128" y1="128" x2="83"  y2="158"/>
    <line x1="128" y1="128" x2="173" y2="158"/>
  </g>

  <!-- agents -->
  <g fill="#a5d8ff" stroke="#3b4252" stroke-width="7">
    <rect x="62"  y="62"  width="42" height="42" rx="8"/>
    <rect x="152" y="62"  width="42" height="42" rx="8"/>
    <rect x="62"  y="137" width="42" height="42" rx="8"/>
    <rect x="152" y="137" width="42" height="42" rx="8"/>
  </g>

  <!-- hub -->
  <circle cx="128" cy="128" r="17" fill="#ffec99" stroke="#3b4252" stroke-width="7"/>

  <!-- operator standing in the gate -->
  <circle cx="128" cy="226" r="15" fill="#b2f2bb" stroke="#3b4252" stroke-width="7"/>
</svg>